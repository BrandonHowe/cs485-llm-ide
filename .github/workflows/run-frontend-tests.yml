name: Run Frontend Tests

on:
  # Reuse the same browser test definition from the release workflow so packaging
  # is blocked by the exact VSClone UI checks that already protect pull requests.
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-tests:
    name: VSClone Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Install Linux System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm

      - name: Install Build Dependencies
        working-directory: build
        run: |
          # Browser CI pulls the same native toolchain payloads as the backend
          # workflow, so retries keep one-off upstream 5xx responses from
          # failing the UI gate before any VSClone code has actually run.
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Workspace Dependencies
        run: |
          # setup-env.sh performs the same libc++ fetches that are flaking in CI,
          # so the retry loop has to rerun that bootstrap phase as well as npm ci.
          for attempt in 1 2 3; do
            # The retry needs to start from a clean toolchain and node_modules state,
            # otherwise a half-fetched bootstrap can keep breaking later attempts.
            if [ "$attempt" -gt 1 ]; then
              rm -rf node_modules .build/CR_Clang .build/libcxx-objects .build/libcxx_headers .build/libcxxabi_headers
            fi
            if bash -e -c 'source ./build/azure-pipelines/linux/setup-env.sh && npm ci'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-In Extensions
        # The browser runner loads compiled VS Code modules from out/, so we keep the same
        # built-in extension bootstrap that the upstream CI uses before transpiling tests.
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile Browser Test Targets
        # VSClone browser tests execute against transpiled output instead of ts-node-style sources.
        run: npm run gulp transpile-client-esbuild transpile-extensions

      - name: Install Playwright Chromium
        run: npm exec -- playwright install chromium

      - name: Run VSClone Frontend Tests
        run: npm run test-browser-no-install -- --browser chromium --runGlob '**/vsclone/test/browser/**/*.test.js'
        env:
          DEBUG: '*browser*'
