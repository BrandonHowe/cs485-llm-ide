name: Release Main Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Only the newest main build should publish because older runs would otherwise
  # race to overwrite the shared rolling release and fixed tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  compile-release:
    name: Compile Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm

      - name: Install Workspace Dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-In Extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build VSClone Preact Bundles
        # VSClone browser surfaces import these generated entrypoints directly
        # from src/, so the release compile job has to materialize them in its
        # own checkout before the shared TypeScript compile snapshots src/ into
        # out-build. The backend/frontend test jobs already do this, but their
        # workspaces do not carry over into this separate release job.
        run: npm run build-vsclone-preact

      - name: Compile Shared Build Outputs
        # Keep the expensive compile isolated so the Actions log shows whether
        # the pipeline is genuinely hanging in TypeScript compilation or has
        # already moved on to minification. The earlier single-step wrapper hid
        # all three phases behind one status label, which made failures much
        # harder to reason about from GitHub-hosted runs. Use the supported
        # non-mangled compile path here because GitHub-hosted release validation
        # has repeatedly stalled in the mangled variant before platform package
        # jobs could even start.
        run: |
          set -e
          date -u
          npm run gulp compile-build-without-mangling
          date -u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Minified Client Bundle
        # The platform packaging jobs only consume the client-side
        # `out-vscode-min` tree, so keep this as a dedicated step with its own
        # timing and failure boundary.
        run: |
          set -e
          date -u
          npm run gulp minify-vscode
          date -u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Shared Extension Outputs
        # Build extension artifacts separately from the client minification so
        # GitHub Actions exposes which phase is slow or broken instead of
        # reporting one opaque "Build Shared Compilation Outputs" step.
        run: |
          set -e
          date -u
          npm run gulp extensions-ci
          date -u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Compilation Outputs
        run: |
          set -e
          [ -d "out-build" ] || { echo "ERROR: out-build folder is missing" >&2; exit 1; }
          [ -n "$(find out-build -mindepth 1 | head -1)" ] || { echo "ERROR: out-build folder is empty" >&2; exit 1; }
          [ -d "out-vscode-min" ] || { echo "ERROR: out-vscode-min folder is missing" >&2; exit 1; }
          [ -n "$(find out-vscode-min -mindepth 1 | head -1)" ] || { echo "ERROR: out-vscode-min folder is empty" >&2; exit 1; }
          [ -d ".build/extensions" ] || { echo "ERROR: .build/extensions folder is missing" >&2; exit 1; }
          [ -n "$(find .build/extensions -mindepth 1 | head -1)" ] || { echo "ERROR: .build/extensions folder is empty" >&2; exit 1; }

      - name: Archive Compilation Outputs
        run: |
          set -e
          tar -cz --exclude='.build/node_modules_cache' --exclude='.build/node_modules_list.txt' --exclude='.build/distro' -f compilation.tar.gz .build out-build out-vscode-min

      - name: Upload Compilation Artifact
        uses: actions/upload-artifact@v6
        with:
          name: compilation-release-input
          path: compilation.tar.gz
          if-no-files-found: error

  backend-tests:
    name: VSClone Backend Tests
    uses: ./.github/workflows/run-backend-tests.yml

  frontend-tests:
    name: VSClone Frontend Tests
    uses: ./.github/workflows/run-frontend-tests.yml

  build-windows:
    name: Build Windows Installer
    runs-on: windows-2022
    needs:
      - compile-release
      - backend-tests
      - frontend-tests
    permissions:
      contents: read
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compilation Artifact
        uses: actions/download-artifact@v5
        with:
          name: compilation-release-input

      - name: Extract Compilation Output
        shell: pwsh
        run: tar -xzf compilation.tar.gz

      - name: Install Workspace Dependencies
        shell: pwsh
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-In Extensions
        shell: pwsh
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Client
        shell: pwsh
        # Gulp runs multiple CLI task arguments in parallel, but the installer
        # packaging task reads files produced by the min build. Keep the steps
        # split so a clean GitHub Actions checkout cannot race on product.json.
        run: npm run gulp "vscode-win32-x64-min-ci"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Inno Updater
        shell: pwsh
        # The updater binary has to land in the built client tree before Inno
        # Setup packages the user installer, matching the upstream CI sequence.
        run: npm run gulp "vscode-win32-x64-inno-updater"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows User Setup
        shell: pwsh
        # Package the installer only after the application bundle and updater
        # helper both exist, otherwise the gulp task fails on missing inputs.
        run: npm run gulp "vscode-win32-x64-user-setup"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Windows Release Asset
        shell: pwsh
        run: |
          $Version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item ".build/win32-x64/user-setup/VSCodeSetup.exe" "release/VSCodeUserSetup-x64-$Version.exe"
          # Stable alias so deep links like /releases/latest/download/VSCodeUserSetup-x64-latest.exe
          # keep resolving when package.json version bumps change the versioned filename.
          Copy-Item ".build/win32-x64/user-setup/VSCodeSetup.exe" "release/VSCodeUserSetup-x64-latest.exe"

      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-assets
          path: release/*.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon Bundle
    runs-on: macos-14
    needs:
      - compile-release
      - backend-tests
      - frontend-tests
    permissions:
      contents: read
    env:
      npm_config_arch: arm64
      VSCODE_ARCH: arm64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compilation Artifact
        uses: actions/download-artifact@v5
        with:
          name: compilation-release-input

      - name: Extract Compilation Output
        run: tar -xzf compilation.tar.gz

      - name: Install Workspace Dependencies
        run: |
          set -e
          c++ --version
          xcode-select -print-path
          # Homebrew-managed Python on macos-14 enforces PEP 668, so install
          # setuptools through the shared helper before npm ci runs native gyp.
          node build/lib/pythonPackages.ts setuptools
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Match the upstream workaround so native auth dependencies resolve
          # the same way on GitHub-hosted Apple Silicon runners.
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Download Built-In Extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS arm64 Client
        run: npm run gulp "vscode-darwin-arm64-min-ci"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage macOS arm64 Release Asset
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release
          # Ship the Apple Silicon bundle directly as the macOS release asset.
          # The Intel/universal merge path was removed because macos-13 runner
          # availability made it the long pole on every release.
          # GitHub-hosted macOS runners invoke the gulp package task from the
          # repository checkout, but the actual app bundle location can vary
          # between ../VSCode-darwin-arm64 and .build depending on the build
          # layout. Resolve it from the package output instead of assuming the
          # Azure Pipelines workspace shape.
          APP_PATH="$(find .. .build -type d -name '*.app' -path '*/VSCode-darwin-arm64/*' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: macOS app bundle was not produced." >&2
            find .. .build -type d -name 'VSCode-darwin-arm64' -print >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/VSCode-darwin-arm64-${VERSION}.zip"
          # Stable alias so deep links like /releases/latest/download/VSCode-darwin-arm64-latest.zip
          # keep resolving when package.json version bumps change the versioned filename.
          cp "release/VSCode-darwin-arm64-${VERSION}.zip" "release/VSCode-darwin-arm64-latest.zip"

      - name: Upload macOS arm64 Release Asset
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-release-assets
          path: release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Rolling GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos-arm64
    # Manual branch runs are useful for validating the release build graph, but
    # only an actual push to main should move the rolling tag and release.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows Release Asset
        uses: actions/download-artifact@v5
        with:
          name: windows-release-assets
          path: release-assets

      - name: Download macOS Apple Silicon Release Asset
        uses: actions/download-artifact@v5
        with:
          name: macos-arm64-release-assets
          path: release-assets

      - name: Move Fixed Release Tag To Current Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f main-latest "$GITHUB_SHA"
          git push origin refs/tags/main-latest --force

      - name: Create Or Update Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="main-latest"
          SHORT_SHA="${GITHUB_SHA::7}"
          TITLE="Latest Main Build (${SHORT_SHA})"
          NOTES_FILE="$(mktemp)"

          cat > "$NOTES_FILE" <<EOF
          Automated rolling build for commit \`${GITHUB_SHA}\`.

          Assets:
          - Windows: unsigned x64 installer \`.exe\`
          - macOS: unsigned Apple Silicon (arm64) \`.app\` bundle packaged as \`.zip\`

          Install notes:
          - Windows: if SmartScreen warns, click "More info" and then "Run anyway".
          - macOS: if Gatekeeper blocks the app, use "Open Anyway" in Privacy & Security and relaunch it once.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[]?.name' | while IFS= read -r asset_name; do
              if [ -n "$asset_name" ]; then
                gh release delete-asset "$TAG" "$asset_name" --yes
              fi
            done

            gh release upload "$TAG" release-assets/* --clobber
            # Use gh release edit instead of raw gh api PATCH. The REST
            # /releases/{release_id} endpoint wants the numeric databaseId;
            # --json id returns the GraphQL node_id, which 404s when passed
            # into the REST URL. gh release edit takes the tag directly and
            # handles the lookup internally.
            gh release edit "$TAG" \
              --tag "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
