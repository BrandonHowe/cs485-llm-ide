name: Run Backend Tests

on:
  # Keep this workflow runnable on its own, but also expose it as a reusable gate
  # so the release pipeline cannot drift away from the exact VSClone backend checks.
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: VSClone Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Install Linux System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm

      - name: Install Build Dependencies
        working-directory: build
        run: |
          # GitHub-hosted runners occasionally hit transient 5xx responses while
          # restoring large native toolchain artifacts, so retry the install a
          # few times before treating the backend test gate as genuinely broken.
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Workspace Dependencies
        run: |
          # setup-env.sh performs the flaky libc++ and sysroot downloads before
          # npm ever starts, so the retry boundary has to cover the sourced
          # script and the install together instead of only retrying npm ci.
          for attempt in 1 2 3; do
            # Failed bootstrap attempts can leave partial toolchain artifacts and
            # native module outputs behind, so reset those directories before retrying.
            if [ "$attempt" -gt 1 ]; then
              rm -rf node_modules .build/CR_Clang .build/libcxx-objects .build/libcxx_headers .build/libcxxabi_headers
            fi
            if bash -e -c 'source ./build/azure-pipelines/linux/setup-env.sh && npm ci'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-In Extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build VSClone Preact Bundles
        # VSClone workbench surfaces import these generated browser entrypoints directly, so a
        # clean-checkout CI job has to materialize them before the transpile step snapshots src/ into out/.
        run: npm run build-vsclone-preact

      - name: Transpile Backend Test Targets
        # The node and Electron runners both execute the compiled out/ tree, so CI must
        # transpile the VSClone sources before either backend test slice can resolve imports.
        run: npm run gulp transpile-client-esbuild transpile-extensions

      - name: Download Electron Runtime
        run: npm run electron -- x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run VSClone Backend Common Tests
        run: npm run test-node -- --runGlob '**/vsclone/test/common/**/*.test.js'

      - name: Run VSClone Backend Electron Tests
        # GitHub-hosted Ubuntu runners mount the workspace without a usable Chromium setuid sandbox,
        # so the Electron test slice has to opt out explicitly while still running under xvfb.
        run: xvfb-run -a ./scripts/test.sh --no-sandbox --disable-gpu-sandbox --runGlob '**/vsclone/test/electron-main/**/*.test.js'
