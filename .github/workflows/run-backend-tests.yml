name: Run Backend Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: VSClone Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json

      - name: Install Linux System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm

      - name: Install Build Dependencies
        working-directory: build
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Workspace Dependencies
        run: |
          source ./build/azure-pipelines/linux/setup-env.sh
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-In Extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile Backend Test Targets
        # The node and Electron runners both execute the compiled out/ tree, so CI must
        # transpile the VSClone sources before either backend test slice can resolve imports.
        run: npm run gulp transpile-client-esbuild transpile-extensions

      - name: Download Electron Runtime
        run: npm run electron -- x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run VSClone Backend Common Tests
        run: npm run test-node -- --runGlob '**/vsclone/test/common/**/*.test.js'

      - name: Run VSClone Backend Electron Tests
        # The Electron unit runner still launches a renderer process, so xvfb keeps Linux CI
        # headless without changing the test environment that VSClone uses on desktop.
        run: xvfb-run -a ./scripts/test.sh --runGlob '**/vsclone/test/electron-main/**/*.test.js'
