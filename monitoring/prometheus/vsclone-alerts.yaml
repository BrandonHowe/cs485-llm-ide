groups:
  - name: vsclone.rules
    rules:
      - alert: VSCloneHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(vsclone_request_duration_ms_bucket[5m])) by (le, vendor)) > 2000
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "VSClone p95 request latency > 2000ms (5m)"
          description: "p95 latency for {{ $labels.vendor }} is above 2000ms for more than 5 minutes."

      - alert: VSCloneHighErrorRate
        expr: |
          (sum(rate(vsclone_request_errors_total[5m])) by (vendor)) / (sum(rate(vsclone_request_duration_ms_count[5m])) by (vendor)) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "VSClone error rate > 1% (5m)"
          description: "Error rate for {{ $labels.vendor }} exceeded 1% over the last 5 minutes."

      - alert: VSCloneHighInFlightRequests
        expr: vsclone_requests_in_flight > 50
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Too many in-flight VSClone requests"
          description: "Number of in-flight VSClone requests is > 50. Investigate backlog or throttling."

      - alert: VSCloneSlowTimeToFirstTokenP95
        expr: |
          histogram_quantile(0.95, sum(rate(vsclone_time_to_first_token_ms_bucket[5m])) by (le, vendor)) > 500
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "VSClone time-to-first-token p95 > 500ms"
          description: "Time-to-first-token p95 for {{ $labels.vendor }} is above 500ms."

      - alert: VSCloneHighMemoryUsage
        expr: process_resident_memory_bytes > 1e+9
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "High memory usage in VSClone main process"
          description: "Process RSS is above 1GB. Check for leaks or increased load."
